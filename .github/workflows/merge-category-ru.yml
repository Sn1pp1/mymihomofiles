name: Merge Category RU Rules

on:
  schedule:
    # Запуск каждые 6 часов (UTC)
    # 00:00, 06:00, 12:00, 18:00
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run merge script
        run: |
          chmod +x scripts/merge-category-ru.sh
          ./scripts/merge-category-ru.sh

      - name: Generate commit message
        id: commit_msg
        run: |
          echo "msg=Update rules [Build #${{ github.run_number }}] - $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M MSK')" >> $GITHUB_OUTPUT

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "${{ steps.commit_msg.outputs.msg }}"
          file_pattern: 'output/ru-all.*'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
