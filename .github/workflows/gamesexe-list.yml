name: Build gamesexe-list

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamesexe-list.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout target repository
      uses: actions/checkout@v4
      with:
        repository: Sn1pp1/mymihomofiles
        path: mymihomofiles
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create output directory
      run: mkdir -p mymihomofiles/output

    - name: Download and Process gamesexe-list.txt
      run: |
        set -euo pipefail

        SOURCE_URL="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/gamesexe-list.txt"
        TEMP_RAW=$(mktemp)
        TEMP_CLEAN=$(mktemp)
        trap "rm -f $TEMP_RAW $TEMP_CLEAN" EXIT

        echo "📥 Скачивание gamesexe-list.txt..."
        curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$SOURCE_URL" > "$TEMP_RAW"

        if [ ! -s "$TEMP_RAW" ]; then
          echo "❌ Ошибка: Файл пустой или не скачался!"
          exit 1
        fi

        echo "🧹 Парсинг и очистка..."

        # Парсим: убираем комментарии, пустые строки, приводим к нижнему регистру
        awk '
        { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
        /^[[:space:]]*$/ { next }
        /^[[:space:]]*#/ { next }
        {
          d = tolower($0)
          if (d !~ /\.exe$/ && d !~ /\.des$/) next
          if (d ~ /[^a-zA-Z0-9._-]/) next
          print d
        }
        ' "$TEMP_RAW" | LC_ALL=C sort -u > "$TEMP_CLEAN"

        BEFORE=$(wc -l < "$TEMP_CLEAN" | tr -d ' ')
        
        if [ "$BEFORE" -eq 0 ]; then
          echo "❌ Ошибка: После парсинга файл пустой!"
          exit 1
        fi

        echo "✅ Найдено $BEFORE уникальных процессов"

        # Генерируем YAML файл для mihomo rule-set
        echo "payload:" > mymihomofiles/output/gamesexe-list.yaml
        awk '{printf "  - PROCESS-NAME,%s\n", $0}' "$TEMP_CLEAN" >> mymihomofiles/output/gamesexe-list.yaml

        echo ""
        echo "📊 Первые 10 процессов:"
        head -10 "$TEMP_CLEAN" | sed 's/^/   ✓ /'

    - name: Commit and push to mymihomofiles
      run: |
        cd mymihomofiles
        
        git config user.name "gamesexe-list Bot"
        git config user.email "gamesexe-list-bot@github.com"

        git fetch origin main
        git reset --soft origin/main

        git add output/gamesexe-list.yaml

        if ! git diff --staged --quiet; then
          git commit -m "🔄 Update gamesexe-list.yaml ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
          
          for i in 1 2 3; do
            if git push origin main; then
              echo " Файл успешно обновлен в mymihomofiles"
              break
            else
              echo "⚠️ Push не удался, обновляем ветку (попытка $i)..."
              git fetch origin main
              git reset --soft origin/main
              git add output/gamesexe-list.yaml
              git commit -m "🔄 Update gamesexe-list.yaml ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
              sleep 2
            fi
          done
        else
          echo "⏭️ Список не изменился, пропуск коммита"
        fi
